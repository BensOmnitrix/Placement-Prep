<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function getAnimalData(){
            fetch("https:/fakerapi.it/api/v1/persons").then((response) => {
                response.json().then((newData) => {
                    for(let i=0;i<newData['data'].length;i++){
                        console.log(newData['data'][i].firstname);
                    }
                });
                console.log("After response");
            })
            console.log(response);
        }
        async function getAnimalnewData(){
            const response = await fetch("https:/fakerapi.it/api/v1/persons");
            const finalData = await response.json();
            for(let i=0;i<finalData['data'].length;i++){
                console.log(finalData['data'][i].firstname);
            }

        }
    </script>
    <button onclick="getAnimalnewData()">Get Animal Data</button>
</body>
</html>
